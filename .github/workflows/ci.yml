name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    # One release at a time, so two quick pushes never race on tags, notes and the release commit.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The changelog and git plugins are not bundled with semantic-release. GitHub sometimes rejects the notes
      # ref push with a bare "failed"; retry, since a re-run just finds the tag and exits cleanly.
      - run: |
          for attempt in 1 2 3; do
            npx --yes -p semantic-release@24 -p @semantic-release/changelog@6 -p @semantic-release/git@10 semantic-release && exit 0
            echo "semantic-release failed (attempt $attempt)"; sleep 10
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # If a failed attempt pushed the tag but never published, create the missing GitHub release.
      - run: |
          tag=$(git describe --tags --abbrev=0)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
